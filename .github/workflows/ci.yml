name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schiriplan
          POSTGRES_PASSWORD: schiriplan
          POSTGRES_DB: schiriplan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schiriplan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://schiriplan:schiriplan@localhost:5432/schiriplan
      TEST_DATABASE_URL: postgres://schiriplan:schiriplan@localhost:5432/schiriplan
      SESSION_SECRET: nur-fuer-die-ci-nicht-geheim
      NOTIFICATION_CHANNEL: dev
      PUBLIC_BASE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Lint und Design-System-Treue
        run: npm run lint

      - name: Schema einspielen
        run: npm run db:migrate

      - name: Regel-Engine und Datenbank-Zusicherungen
        run: npm run test

      - name: Beispieldaten laden
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium

      # Gegen genau das Artefakt, das auch im Container startet.
      - name: Anwendung starten
        run: |
          npm run start:prepare
          PORT=3100 npm run start &
          npx wait-on http://localhost:3100 --timeout 60000

      - name: E2E — öffentliche Ansicht und Anmeldung
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100

      - name: Aufzeichnungen fehlgeschlagener Läufe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
