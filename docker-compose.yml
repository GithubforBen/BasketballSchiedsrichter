# Betrieb auf dem VPS. Nach aussen ist nichts offen — der Zugriff laeuft
# ausschliesslich ueber den Cloudflare Tunnel, der als eigener Dienst neben
# der App laeuft und sie unter ihrem internen Namen erreicht.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schiriplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schiriplan}
      POSTGRES_DB: schiriplan
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schiriplan']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://schiriplan:${POSTGRES_PASSWORD:-schiriplan}@db:5432/schiriplan
      NODE_ENV: production
      # Muss die oeffentliche Adresse sein, unter der der Tunnel die App
      # veroeffentlicht — nicht der interne Dienstname. Anmeldelinks und
      # Weiterleitungen werden daraus gebaut.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL muss gesetzt sein}
    env_file:
      - .env
    # Kein "ports"-Eintrag: die App ist nur im Compose-Netz erreichbar.
    expose:
      - '3000'

  # Der Zeitgeber. Er ruft den Cron-Endpunkt der App im internen Netz auf —
  # nicht ueber den Tunnel, damit ein Ausfall von Cloudflare die Erinnerungen
  # nicht mitnimmt. Alle fuenf Minuten genuegt: ein Lauf ohne Faelliges tut
  # nichts, und ein doppelter Lauf scheitert an den Schluesseln der Outbox.
  cron:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET muss gesetzt sein}
    # busybox bringt wget mit — kein Paket nachzuinstallieren, damit ein
    # Neustart ohne Netz zum Paketspiegel trotzdem gelingt.
    command: >
      sh -c 'while true; do
      wget -q -O /dev/null --post-data=""
      --header="authorization: Bearer $$CRON_SECRET"
      http://app:3000/api/cron || echo "Cron-Lauf fehlgeschlagen";
      sleep 300; done'

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db-data:
