# Betrieb auf dem VPS. Nach aussen ist nichts offen — der Zugriff laeuft
# ausschliesslich ueber den Cloudflare Tunnel, der als eigener Dienst neben
# der App laeuft und sie unter ihrem internen Namen erreicht. Einzige Ausnahme
# ist CloudBeaver ganz unten, und das nur im lokalen Netz.
#
# Alle Dienste mit "restart: always": sie kommen nach einem Neustart des
# Rechners wieder hoch, auch wenn sie vorher von Hand angehalten wurden. Mit
# "unless-stopped" blieb nach einem `docker compose stop` und einem Reboot
# alles aus. Die Reihenfolge aus depends_on gilt beim Start durch Docker
# selbst nicht — deshalb wartet die Sicherung unten selbst auf die Datenbank.
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: schiriplan
      # Kein Standardwert, so wie bei CRON_SECRET und PUBLIC_BASE_URL auch.
      # Hier stand "schiriplan" — derselbe Wert wie Benutzer und Datenbank, und
      # er steht in .env.example, also oeffentlich. Wer den Verbund ohne
      # gesetzte Variable hochzieht, bekommt damit eine Datenbank mit einem
      # Passwort, das jeder kennt. Nach aussen ist sie zwar nicht offen (kein
      # "ports"-Eintrag), aber jeder andere Dienst im Compose-Netz erreicht sie
      # — und die Sicherungen unter ./sicherungen enthalten Telefonnummern.
      # Ein Abbruch beim Start ist die bessere Antwort als ein stiller Standard.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: schiriplan
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - default
      - verwaltung
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schiriplan']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://schiriplan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/schiriplan
      NODE_ENV: production
      # Muss die oeffentliche Adresse sein, unter der der Tunnel die App
      # veroeffentlicht — nicht der interne Dienstname. Anmeldelinks und
      # Weiterleitungen werden daraus gebaut.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL muss gesetzt sein}
      # Der Next-Server lauscht auf $HOSTNAME, und Docker setzt dort die
      # Container-ID ein. Dann antwortet er nur unter der Adresse des
      # Containers, nicht auf der Rueckschleife, und der Healthcheck unten
      # meldete dauerhaft "unhealthy", obwohl die Anwendung lief.
      HOSTNAME: 0.0.0.0
    env_file:
      - .env
    # Kein "ports"-Eintrag: die App ist nur im Compose-Netz erreichbar.
    expose:
      - '3000'
    # Der Healthcheck fragt die Datenbank mit an: ein Prozess, der laeuft, aber
    # die Datenbank nicht erreicht, kann nichts ausliefern und soll auch nicht
    # als gesund gelten. busybox-wget statt curl — kein Paket nachzuinstallieren.
    # 127.0.0.1 statt localhost: busybox-wget nimmt fuer localhost zuerst ::1,
    # und auf IPv6 lauscht der Server mit HOSTNAME=0.0.0.0 nicht.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/gesundheit || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Der Zeitgeber. Er ruft den Cron-Endpunkt der App im internen Netz auf —
  # nicht ueber den Tunnel, damit ein Ausfall von Cloudflare die Erinnerungen
  # nicht mitnimmt. Alle fuenf Minuten genuegt: ein Lauf ohne Faelliges tut
  # nichts, und ein doppelter Lauf scheitert an den Schluesseln der Outbox.
  cron:
    image: alpine:3.21
    restart: always
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET muss gesetzt sein}
    # busybox bringt wget mit — kein Paket nachzuinstallieren, damit ein
    # Neustart ohne Netz zum Paketspiegel trotzdem gelingt.
    command: >
      sh -c 'while true; do
      wget -q -O /dev/null --post-data=""
      --header="authorization: Bearer $$CRON_SECRET"
      http://app:3000/api/cron || echo "Cron-Lauf fehlgeschlagen";
      sleep 300; done'

  # Taegliche Sicherung der Datenbank.
  #
  # Sie liegt bewusst als eigener Dienst hier und nicht als Cron-Eintrag auf
  # dem VPS: so zieht `docker compose up` die Sicherung mit hoch, und wer den
  # Verbund umzieht, nimmt sie mit. Aufbewahrt werden 14 Staende — genug, um
  # einen Fehler zu bemerken, der erst nach ein paar Tagen auffaellt.
  backup:
    image: postgres:17-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - ./sicherungen:/sicherungen
    #
    # Nach einem Neustart des Rechners startet Docker alle Dienste zugleich,
    # ohne auf depends_on zu achten. Deshalb wartet jeder Lauf erst, bis die
    # Datenbank antwortet.
    #
    # Erst in eine Datei, dann packen: in einer Pipe verschluckte gzip einen
    # Abbruch von pg_dump, und uebrig blieb eine leere Datei, die wie eine
    # gelungene Sicherung aussah. Aufgeraeumt wird nur nach einer gelungenen
    # Sicherung — sonst loeschte eine Reihe von Fehlschlaegen nach 14 Tagen
    # die letzten guten Staende.
    command: >
      sh -c 'while true; do
      until pg_isready -q -h db -U schiriplan; do sleep 5; done;
      ziel="/sicherungen/schiriplan-$$(date +%Y-%m-%d).sql.gz";
      if pg_dump -h db -U schiriplan schiriplan > /tmp/sicherung.sql
      && gzip -c /tmp/sicherung.sql > "$$ziel.teil"
      && mv "$$ziel.teil" "$$ziel";
      then echo "Sicherung: $$ziel";
      find /sicherungen -name "schiriplan-*.sql.gz" -mtime +14 -delete;
      else echo "Sicherung fehlgeschlagen"; rm -f "$$ziel.teil";
      fi;
      rm -f /tmp/sicherung.sql;
      sleep 86400; done'

  # Feste Version statt latest: sie wechselt nur, wenn hier eine neue steht.
  # 2026.10.3 enthaelt den Schutz vor den kompromittierten eMudhra-Zwischen-
  # zertifikaten (CVE-2026-111943, ab 2026.10.2).
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

  # Datenbank im Browser ansehen: CloudBeaver, nur im lokalen Netz.
  #
  # Der einzige Dienst mit einem veroeffentlichten Port — und der Tunnel kennt
  # ihn nicht. Drei Riegel halten ihn aus dem Internet heraus:
  #
  # 1. Er haengt nur am Netz "verwaltung", das er sich mit der Datenbank teilt.
  #    Tunnel und App sitzen nicht darin; selbst eine Regel, die jemand im
  #    Cloudflare-Dashboard auf "cloudbeaver:8978" anlegt, liefe ins Leere.
  # 2. Der Port lauscht auf CLOUDBEAVER_ADRESSE, ohne Angabe nur auf der
  #    Rueckschleife. Fuers lokale Netz steht dort die LAN-Adresse des Rechners,
  #    niemals 0.0.0.0: Docker oeffnet veroeffentlichte Ports an ufw vorbei, und
  #    auf einem VPS hiesse 0.0.0.0 "fuer das ganze Internet".
  # 3. Ohne Anmeldung kommt niemand hinein. Der Verwalter wird beim ersten
  #    Start aus den Variablen angelegt — sonst richtete der erste Besucher im
  #    Einrichtungsassistenten sich selbst als Admin ein —, und der anonyme
  #    Zugang, den CloudBeaver von Haus aus anbietet, ist aus.
  #
  # Port 18978 statt der ueblichen 8978: darauf liegt sonst nichts.
  #
  # Die Verbindung zur Datenbank ist vorbereitet, ihr Passwort aber nicht
  # gespeichert — es wird beim Verbinden abgefragt. Wer CloudBeaver offen hat,
  # sieht alle Namen und Telefonnummern; das Passwort ist die zweite Tuer.
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.4
    restart: always
    depends_on:
      - db
    networks:
      - verwaltung
    ports:
      - '${CLOUDBEAVER_ADRESSE:-127.0.0.1}:18978:8978'
    environment:
      CB_SERVER_NAME: Schiriplan
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN:-verwalter}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_PASSWORT:?CLOUDBEAVER_PASSWORT muss gesetzt sein}
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: 'false'
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
      # Wird nur beim allerersten Start in den Arbeitsbereich kopiert.
      - ./cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro

# "default" ist das Netz, das Compose ohnehin anlegt; die Datenbank haengt
# zusaetzlich an "verwaltung", damit CloudBeaver sie erreicht.
networks:
  default:
  verwaltung:

volumes:
  db-data:
  cloudbeaver-workspace:
